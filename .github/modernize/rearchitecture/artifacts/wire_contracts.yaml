  - name: "Socket.IO authentication, ride and driver realtime"
    unit: passenger-booking
    type: sdk
    stability: must_preserve
    source_loc: "../api/app/views/realtime.py:20"
    contract:
      method: "Socket.IO connect + named events"
      path: "Default Socket.IO namespace; JWT supplied as `auth: {token}` (or query/Bearer header)."
      request: "Client events: join_ride `{rideId}`, leave_ride `{rideId}`, driver:go_online `{latitude?,longitude?,heading?}`, driver:go_offline, driver:location_update `{latitude,longitude,heading?,rideId?}`, driver:heartbeat or ping, ride:send_message `{rideId,content}`."
      response: "connected (activeRideIds/rooms), driver:availability_changed, driver:location_updated, driver:offline, ride:new, ride:offer_received, ride:accepted, ride:taken, ride:expired, ride:status_changed, ride:driver_location, ride:message, ride:paid, ride:cancelled, wallet:updated, driver:verification_updated, notification:new; `error` for rejected event operations."
      error: "Invalid/revoked/inactive JWT rejects connect; event errors carry code/message. Room access is participant/driver scoped."
      auth: "Socket JWT is decoded and blocklist-checked; connected user is joined to user/passenger map and permitted active ride rooms."
    target_contract:
      method: "Flutter Socket.IO client connects with access token in auth payload; subscribe to server-emitted event names and emit only supported client events."
      notes: "Use REST for current-state reads and durable writes; Socket.IO for supported realtime. API events are not automatically equivalent to every Firestore query stream."
    semantic_divergence: []

  - name: "File serving"
    unit: profile-edit
    type: file
    stability: must_preserve
    source_loc: "../api/app/views/files.py:30"
    contract:
      method: "GET"
      path: |
        GET /api/files/drivers/<driver_id>/<path:subpath>
        GET /api/files/<path:subpath>
      request: "Avatar and driver document upload routes are `/api/users/me/avatar` and `/api/drivers/me/documents/<doc_type>`; file URLs use the API host."
      response: "Stored file bytes, with path traversal and driver-root checks; file absence is 404."
      error: "403 driver file access denied; 404 FILE_NOT_FOUND; upload size/type errors returned by owning upload route."
      auth: "Driver file route requires JWT and driver ownership/admin; non-driver file route is public in current code."
    target_contract:
      method: "Flutter uploads through authenticated multipart API routes and renders API `photoUrl`/document `url` or returned API file path; never uses Firebase Storage."
      notes: "Do not assume public URLs are host-independent: configure the API host and resolve relative API file paths against it when needed."
    semantic_divergence: []

  - name: "Health probes"
    unit: global
    type: rest
    stability: must_preserve
    source_loc: "../api/app/views/health.py:11"
    contract:
      method: "GET"
      path: |
        GET /
        GET /api/health
      request: "No body."
      response: "Welcome/service metadata and DB health JSON."
      error: "GET /api/health returns 503 DATABASE_UNAVAILABLE when database probe fails."
      auth: "Health probes are public; individual API operations retain their route-specific auth."

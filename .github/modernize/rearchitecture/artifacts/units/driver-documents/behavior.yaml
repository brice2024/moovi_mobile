unit: driver-documents
side_effects:
  - source_loc: "lib/driversScreens/DriverDocsVerificationPage.dart:80"
    effect: "Loads required driver document statuses and derives completion progress and per-document status cards."
    must_preserve: true
  - source_loc: "lib/driversScreens/test/document_status_page.dart:82"
    effect: "A separate test-folder document-status screen can load driver document records and show details; no constructor call site is present in the scanned Dart library."
    must_preserve: false
branches:
  - source_loc: "lib/driversScreens/DriverDocsVerificationPage.dart:39"
    condition: "Each required item is missing, pending, verified or rejected."
    behavior: "Render exact status and completion count; map API `documentsSummary.items` fields, not Firestore map assumptions."
    must_preserve: true
  - source_loc: "lib/driversScreens/DriverDocsVerificationPage.dart:135"
    condition: "User chooses verification continuation."
    behavior: "Open OffersPage only via the existing action path; server verification status may block online state."
    must_preserve: true
  - source_loc: "lib/driversScreens/test/document_status_page.dart:116"
    condition: "The disconnected test-folder `DocumentStatusPage` is considered during migration."
    behavior: "Do not claim this screen is currently user-reachable; either migrate its repository if intentionally wired or remove it only after confirming it is not required."
    must_preserve: true
error_paths:
  - source_loc: "lib/driversScreens/DriverDocsVerificationPage.dart:90"
    trigger: "Document list/profile request fails."
    outcome: "Display inability to load documents, not an all-missing or verified fallback."
    contract: "GET `/api/drivers/me/documents` or `/api/drivers/me` requires driver JWT."
    must_preserve: true
concurrency:
  model: coroutine
  tx_boundary:
    source_loc: "../api/app/views/drivers.py:354"
    scope: "Document upload and verification status metadata are committed by API."
    isolation: "API database transaction"
    must_preserve: true

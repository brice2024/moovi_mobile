unit: passenger-payment
bindings:
  - type: convention
    name: "showPayCentralPaymentSheet opens modal payment UI"
    source_loc: "lib/widgets/paycentral_payment_sheet.dart:15"
    target: "PayCentralPaymentSheet"
    must_appear_in_target: true
    notes: "Current scan found no call site; if wired, use API payment initiation/status routes, not the direct provider service."
  - type: convention
    name: "FirebaseAuth currentUser supplies default phone; DriverService writes paid state"
    source_loc: "lib/widgets/paycentral_payment_sheet.dart:76"
    target: "PayCentralPaymentSheet"
    must_appear_in_target: false
    notes: "Use API-authenticated profile phone and server settlement; remove Firestore payment writes."
runtime_config:
  - key: "PayCentral provider base URL/API key"
    source_loc: "lib/services/paycentral_service.dart:114"
    source: code
    default_value: "Provider base URL and embedded default key"
    must_appear_in_target: false
    notes: "Provider integration belongs to API; credential value intentionally omitted."
